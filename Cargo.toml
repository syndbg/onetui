[package]
name = "onetui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "OneTUI: a terminal browser for databases and streams"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
qdrant-client = { version = "1.19", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
toml = "1.0"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
tonic-prost = "0.14"
