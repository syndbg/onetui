[workspace]
members = ["crates/core", "crates/codec", "crates/postgres", "crates/qdrant", "crates/kafka", "crates/nats", "crates/theme", "crates/tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
anyhow = "1"
async-nats = { version = "0.50", default-features = false, features = ["ring", "jetstream"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
# The polling backend avoids stranded PTY input during concurrent Unix resize events.
crossterm = { version = "0.29", features = ["event-stream", "use-dev-tty"] }
futures-util = "0.3"
qdrant-client = { version = "1.19", default-features = false }
rdkafka = { version = "0.39", default-features = false, features = ["cmake-build", "ssl-vendored", "libz-static", "zstd", "tokio"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
toml = "1.0"
url = "2"

nix = { version = "0.31", features = ["term", "fs"] }
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
tonic-prost = "0.14"

[package]
name = "onetui"
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "OneTUI: a terminal browser for databases and streams"
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
onetui-core = { path = "crates/core" }
onetui-postgres = { path = "crates/postgres" }
onetui-qdrant = { path = "crates/qdrant" }
onetui-kafka = { path = "crates/kafka" }
onetui-nats = { path = "crates/nats" }
onetui-tui = { path = "crates/tui" }
onetui-theme = { path = "crates/theme" }
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
