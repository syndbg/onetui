name: onetui
arch: amd64
platform: linux
version: ${ONETUI_PACKAGE_VERSION}
maintainer: syndbg <syndbg@users.noreply.github.com>
description: A read-only terminal browser for databases and streams
homepage: https://github.com/syndbg/onetui
license: Apache-2.0
contents:
  - src: ${ONETUI_PACKAGE_BINARY}
    dst: /usr/bin/onetui
    expand: true
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/licenses/onetui/LICENSE
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/licenses/onetui/THIRD_PARTY_NOTICES.md
  - src: README.md
    dst: /usr/share/doc/onetui/README.md
overrides:
  deb:
    depends:
      - libc6 (>= ${ONETUI_GLIBC_VERSION})
      - libgcc-s1
      - libstdc++6
      - libcurl4t64
      - libsasl2-2
      - libgssapi-krb5-2
    recommends:
      - libsasl2-modules-gssapi-mit
  rpm:
    depends:
      - glibc >= ${ONETUI_GLIBC_VERSION}
      - libgcc
      - libstdc++
      - libcurl
      - cyrus-sasl-lib
      - krb5-libs
    recommends:
      - cyrus-sasl-gssapi
