[package]
name = "onetui-dynamodb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
onetui-core = { path = "../core" }
aws-config = { version = "1.12", default-features = false, features = ["rt-tokio", "sso"] }
aws-sdk-dynamodb = { version = "1.124", default-features = false, features = ["rt-tokio"] }
aws-sdk-dynamodbstreams = { version = "1.111", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.4", default-features = false, features = ["rustls-ring"] }
aws-smithy-runtime-api = { version = "1.16", features = ["client"] }
aws-smithy-types = { version = "1.5", features = ["http-body-1-x"] }
base64.workspace = true
http-body-util = "0.1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
