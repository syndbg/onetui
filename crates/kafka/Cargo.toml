[package]
name = "onetui-kafka"
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
onetui-core = { path = "../core" }
onetui-avro = { path = "../avro" }
onetui-protobuf = { path = "../protobuf" }
anyhow.workspace = true
rdkafka.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
base64.workspace = true
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
apache-avro = { version = "0.22", default-features = false }
rustls.workspace = true
tempfile.workspace = true
prost = "0.14"
prost-types = "0.14"
protox = "0.9.1"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["dir"] }
