name: Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag. Leave empty to package the selected branch.
        type: string
        default: ''
      test-install:
        description: Install Linux packages on all supported distros.
        type: boolean
        default: true
      macos:
        description: Build both native macOS archives.
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: Published release tag. Leave empty to package the checkout.
        type: string
        default: ''
      test-install:
        description: Install Linux packages on all supported distros.
        type: boolean
        default: false
      macos:
        description: Build both native macOS archives.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          package_id=$(cargo pkgid --locked)
          version=${package_id##*#}
          version=${version##*@}
          tag=${RELEASE_TAG:-v$version}
          make release-check TAG="$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # Build on the oldest supported glibc so the archive and deb run on Ubuntu 22.04 and Debian 12.
    name: Package (Ubuntu 22.04)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Native build tools
        run: |
          apt update
          apt install -y git curl ca-certificates make build-essential cmake perl pkg-config binutils libcurl4-openssl-dev libsasl2-dev libsasl2-modules-gssapi-mit libkrb5-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - name: Trust checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs -o /tmp/onetui-rustup.sh
          sh /tmp/onetui-rustup.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Package native binary and checksum
        run: bash scripts/release.sh package "$RELEASE_TAG"
      - name: Package deb
        run: make package-deb TAG="$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-linux-deb
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  rpm:
    needs: version
    name: Package (AlmaLinux 9)
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Native build tools
        run: dnf install -y git gcc gcc-c++ cmake make perl perl-Digest-SHA pkgconf-pkg-config libcurl-devel cyrus-sasl-devel cyrus-sasl-gssapi krb5-devel binutils golang tar gzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - name: Trust checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs -o /tmp/onetui-rustup.sh
          sh /tmp/onetui-rustup.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build rpm
        shell: bash
        run: make package package-rpm TAG="$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-rpm
          path: |
            dist/*.rpm
            dist/*.rpm.sha256
          if-no-files-found: error
          retention-days: 7

  arch:
    needs: version
    name: Package (Arch Linux)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Native build tools
        run: pacman -Syu --noconfirm base-devel git cargo cmake perl curl cyrus-sasl krb5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - name: Build Arch package and checksum
        env:
          BUILD_CHECKOUT: ${{ inputs.tag == '' }}
        run: |
          if [ "$BUILD_CHECKOUT" = true ]; then
            export ONETUI_ARCH_SOURCE="git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA"
          fi
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'make package-arch TAG="$RELEASE_TAG"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-arch
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: version
    if: inputs.macos
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Native build tools
        run: brew list cmake > /dev/null 2>&1 || brew install cmake
      - name: Build native archive
        run: make package TAG="$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify-install:
    if: inputs.test-install
    needs: [version, build, rpm, arch]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Install packages on supported distros
        run: make test-install TAG="$RELEASE_TAG"
