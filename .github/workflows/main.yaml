name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Native Kafka build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl pkg-config libcurl4-openssl-dev libsasl2-dev libsasl2-modules-gssapi-mit
      - run: make verify build-release
      - name: Validate workflow definitions
        run: make workflow-lint
      - name: Disposable datasource integration tests
        run: make test-integration
      - name: Fixture cleanup fallback
        if: always()
        run: make dev-down
