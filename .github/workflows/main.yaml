name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Native Kafka build tools
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake perl pkg-config libcurl4-openssl-dev libsasl2-dev libsasl2-modules-gssapi-mit
      - run: make build

  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: make format-check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Native Kafka build tools
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake perl pkg-config libcurl4-openssl-dev libsasl2-dev libsasl2-modules-gssapi-mit
      - run: make clippy

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Native Kafka build tools
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake perl pkg-config libcurl4-openssl-dev libsasl2-dev libsasl2-modules-gssapi-mit
      - run: make test

  shell:
    name: Shell syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: make shell-check

  workflow:
    name: Workflow definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: make workflow-lint

  integration:
    name: Integration (${{ matrix.datasource }})
    needs: [build, format, clippy, unit, shell, workflow]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - datasource: postgres
            images: postgres:16.13
          - datasource: qdrant
            images: qdrant/qdrant:v1.18.2
          - datasource: kafka
            images: apache/kafka:4.2.0 docker.redpanda.com/redpandadata/redpanda:v26.2.2
          - datasource: nats
            images: nats:2.12.15-alpine docker.redpanda.com/redpandadata/redpanda:v26.2.2
          - datasource: dynamodb
            images: amazon/dynamodb-local:3.3.1
          - datasource: rabbitmq
            images: rabbitmq:4.3.5-management
          - datasource: tui
            images: postgres:16.13 qdrant/qdrant:v1.18.2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore Docker image cache
        id: docker-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/onetui-docker-${{ matrix.datasource }}.tar
          key: docker-v1-${{ runner.os }}-${{ matrix.datasource }}-${{ hashFiles('hack/compose.yaml', 'hack/fixtures/*.Dockerfile') }}
      - name: Load Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load --input /tmp/onetui-docker-${{ matrix.datasource }}.tar
      - name: Pull Docker images
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          for image in ${{ matrix.images }}; do
            docker pull "$image"
          done
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Native Kafka build tools
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake perl pkg-config libcurl4-openssl-dev libsasl2-dev libsasl2-modules-gssapi-mit
      - run: make test-integration DATASOURCE=${{ matrix.datasource }}
      - name: Fixture cleanup fallback
        if: always()
        run: make dev-down
      - name: Save Docker images
        if: success() && steps.docker-cache.outputs.cache-hit != 'true'
        run: docker save --output /tmp/onetui-docker-${{ matrix.datasource }}.tar ${{ matrix.images }}
      - name: Store Docker image cache
        if: success() && steps.docker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/onetui-docker-${{ matrix.datasource }}.tar
          key: ${{ steps.docker-cache.outputs.cache-primary-key }}
