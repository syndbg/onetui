name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Package (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Native Kafka build tools
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake perl pkg-config libcurl4-openssl-dev libsasl2-dev libsasl2-modules-gssapi-mit
      - name: Reject tag and package version mismatch
        run: bash scripts/release.sh check "$RELEASE_TAG"
      - run: make verify
      - name: Disposable datasource integration tests
        run: make test-integration
      - name: Package native binary and checksum
        run: bash scripts/release.sh package "$RELEASE_TAG"
      - name: Package and test deb
        run: |
          make package-deb TAG="$RELEASE_TAG"
          sudo apt install -y ./dist/*.deb
          test "$(/usr/bin/onetui --version)" = "onetui ${RELEASE_TAG#v}"
          /usr/bin/onetui schema --datasource postgres > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-ubuntu-24.04
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Fixture cleanup fallback
        if: always()
        run: make dev-down

  rpm:
    name: Package (Fedora 43)
    runs-on: ubuntu-24.04
    container: fedora:43
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Native build tools
        run: dnf install -y git gcc gcc-c++ cmake make perl perl-Digest-SHA pkgconf-pkg-config libcurl-devel cyrus-sasl-devel cyrus-sasl-gssapi krb5-devel golang tar gzip
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs -o /tmp/onetui-rustup.sh
          sh /tmp/onetui-rustup.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and test rpm
        shell: bash
        run: |
          make package package-rpm TAG="$RELEASE_TAG"
          dnf install -y ./dist/*.rpm
          test "$(/usr/bin/onetui --version)" = "onetui ${RELEASE_TAG#v}"
          /usr/bin/onetui schema --datasource postgres > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-rpm
          path: |
            dist/*.rpm
            dist/*.rpm.sha256
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      EXPECTED_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Native build tools
        run: brew list cmake > /dev/null 2>&1 || brew install cmake
      - name: Build native archive
        run: |
          test "$(rustc -vV | awk '$1 == "host:" {print $2}')" = "$EXPECTED_TARGET"
          make package TAG="$RELEASE_TAG"
      - name: Verify packaged binary
        shell: bash
        run: |
          archive="onetui-${RELEASE_TAG}-${EXPECTED_TARGET}.tar.gz"
          (cd dist && shasum -a 256 -c "$archive.sha256")
          unpacked=$(mktemp -d)
          tar -xzf "dist/$archive" -C "$unpacked"
          test "$("$unpacked/onetui" --version)" = "onetui ${RELEASE_TAG#v}"
          test "$("$unpacked/onetui" -V)" = "onetui ${RELEASE_TAG#v}"
          "$unpacked/onetui" schema --datasource postgres > /dev/null
          # Release binaries must not depend on the runner's Homebrew installation.
          otool -L "$unpacked/onetui" > "$unpacked/libraries.txt"
          while IFS= read -r library; do
            case "$library" in
              /usr/lib/*|/System/Library/*) ;;
              *) printf 'Non-system library in release binary: %s\n' "$library" >&2; exit 1 ;;
            esac
          done < <(awk 'NR > 1 {print $1}' "$unpacked/libraries.txt")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-assets:
    needs: [build, rpm, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Attach assets to the existing UI-published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*
