name: onetui-fixtures
services:
  kafka:
    image: apache/kafka:4.2.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/onetui-kafka-logs
      # Demo timestamps are fixed historical values; keep them until fixture removal.
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_LOG_RETENTION_BYTES: -1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:19092:19092"
    tmpfs:
      - /tmp/onetui-kafka-logs:mode=1777
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 2s
      timeout: 10s
      retries: 30
  postgres:
    image: postgres:16.13
    environment:
      POSTGRES_USER: onetui_fixture_admin
      POSTGRES_PASSWORD: fixture-admin-only
      POSTGRES_DB: onetui_fixture
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./fixtures/postgres.sql:/docker-entrypoint-initdb.d/01-fixture.sql:ro
      - ./fixtures/postgres-tls.sh:/docker-entrypoint-initdb.d/02-tls.sh:ro
      - ./fixtures/server.ext:/onetui-server.ext:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onetui_fixture_admin -d onetui_fixture"]
      interval: 1s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.18.2
    environment:
      QDRANT__SERVICE__API_KEY: fixture-admin-only
      QDRANT__SERVICE__READ_ONLY_API_KEY: fixture-reader-only
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:16334:6334"
    tmpfs:
      - /qdrant/storage
  qdrant-tls:
    image: qdrant/qdrant:v1.18.2
    entrypoint: ["/bin/sh", "/onetui-qdrant-tls.sh"]
    environment:
      QDRANT__SERVICE__API_KEY: fixture-admin-only
      QDRANT__SERVICE__READ_ONLY_API_KEY: fixture-reader-only
      QDRANT__SERVICE__ENABLE_TLS: "true"
      QDRANT__TLS__CERT: /qdrant/tls/server.crt
      QDRANT__TLS__KEY: /qdrant/tls/server.key
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:16335:6334"
    tmpfs:
      - /qdrant/storage
      - /qdrant/tls
    volumes:
      - ./fixtures/qdrant-tls.sh:/onetui-qdrant-tls.sh:ro
      - ./fixtures/server.ext:/onetui-server.ext:ro
    healthcheck:
      test: ["CMD-SHELL", "openssl s_client -connect 127.0.0.1:6334 -servername localhost -alpn h2 -CAfile /qdrant/tls/ca.crt -verify_hostname localhost -verify_return_error < /dev/null > /dev/null 2>&1"]
      interval: 1s
      timeout: 3s
      retries: 30
