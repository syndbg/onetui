name: onetui-fixtures
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:29092
      - --schema-registry-addr=0.0.0.0:8081
      - --set
      - redpanda.auto_create_topics_enabled=false
      - --set
      - redpanda.enable_metrics_reporter=false
    ports:
      - "127.0.0.1:29092:29092"
      - "127.0.0.1:18081:8081"
    tmpfs:
      - /var/lib/redpanda/data:uid=101,gid=101
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=127.0.0.1:9092"]
      interval: 2s
      timeout: 5s
      retries: 30
  nats: &nats_fixture
    build:
      context: ./fixtures
      dockerfile: nats.Dockerfile
    entrypoint: ["/bin/sh", "/nats-tls.sh"]
    ports:
      - "127.0.0.1:14222:4222"
    tmpfs:
      - /data
      - /tls
    volumes:
      - ./fixtures/nats.conf:/nats.conf:ro
      - ./fixtures/nats-tls.sh:/nats-tls.sh:ro
      - ./fixtures/nats-server.ext:/server.ext:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 1s
      timeout: 3s
      retries: 30
  nats-tls:
    <<: *nats_fixture
    ports:
      - "127.0.0.1:14223:4222"
    environment:
      ONETUI_NATS_TLS: "true"
  nats-secure:
    <<: *nats_fixture
    ports:
      - "127.0.0.1:14224:4222"
    environment:
      ONETUI_NATS_MTLS: "true"
    volumes:
      - ./fixtures/nats-secure.conf:/secure.conf:ro
      - ./fixtures/nats-tls.sh:/nats-tls.sh:ro
      - ./fixtures/nats-server.ext:/server.ext:ro
      - ./fixtures/nats-client.ext:/client.ext:ro
  nats-jwt:
    <<: *nats_fixture
    entrypoint: ["nats-server", "-c", "/jwt.conf"]
    ports:
      - "127.0.0.1:14225:4222"
    volumes:
      - ./fixtures/nats-jwt.conf:/jwt.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 1s
      timeout: 3s
      retries: 30
  kafka:
    build:
      context: ./fixtures
      dockerfile: kafka.Dockerfile
    entrypoint: ["/bin/sh", "/onetui-kafka-tls.sh"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092,TLS://:19093,AUTH://:19094,MTLS://:19095,OAUTH://:19096,GSSAPI://:19097
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092,TLS://localhost:19093,AUTH://localhost:19094,MTLS://localhost:19095,OAUTH://localhost:19096,GSSAPI://localhost:19097
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,TLS:SSL,AUTH:SASL_SSL,MTLS:SSL,OAUTH:SASL_SSL,GSSAPI:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/onetui-kafka-logs
      # Demo timestamps are fixed historical values; keep them until fixture removal.
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_LOG_RETENTION_BYTES: -1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_LOCATION: /tmp/onetui-kafka-tls/server.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: fixture-keystore-only
      KAFKA_SSL_KEY_PASSWORD: fixture-keystore-only
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_LISTENER_NAME_MTLS_SSL_CLIENT_AUTH: required
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /tmp/onetui-kafka-tls/trust.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: fixture-keystore-only
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      KAFKA_LISTENER_NAME_OAUTH_SASL_ENABLED_MECHANISMS: OAUTHBEARER
      KAFKA_LISTENER_NAME_OAUTH_OAUTHBEARER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;'
      KAFKA_LISTENER_NAME_OAUTH_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler
      KAFKA_LISTENER_NAME_OAUTH_OAUTHBEARER_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: file:///tmp/onetui-kafka-tls/jwks.json
      KAFKA_LISTENER_NAME_OAUTH_OAUTHBEARER_SASL_OAUTHBEARER_EXPECTED_ISSUER: onetui-fixtures
      KAFKA_LISTENER_NAME_OAUTH_OAUTHBEARER_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: onetui-kafka
      KAFKA_LISTENER_NAME_OAUTH_CONNECTIONS_MAX_REAUTH_MS: 10000
      KAFKA_OPTS: -Dorg.apache.kafka.sasl.oauthbearer.allowed.urls=file:///tmp/onetui-kafka-tls/jwks.json -Djava.security.krb5.conf=/tmp/onetui-kafka-tls/krb5/krb5.conf
      KAFKA_LISTENER_NAME_GSSAPI_SASL_ENABLED_MECHANISMS: GSSAPI
      KAFKA_LISTENER_NAME_GSSAPI_GSSAPI_SASL_JAAS_CONFIG: 'com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true doNotPrompt=true serviceName="kafka" keyTab="/tmp/onetui-kafka-tls/krb5/kafka-localhost.keytab" principal="kafka/localhost@ONETUI.TEST";'
      KAFKA_LISTENER_NAME_AUTH_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required user_fixture-reader="fixture-reader-only" user_fixture-denied="fixture-denied-only";'
      KAFKA_LISTENER_NAME_AUTH_SCRAM___SHA___256_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_LISTENER_NAME_AUTH_SCRAM___SHA___512_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      # Unauthenticated loopback/internal listeners seed the disposable broker.
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:19093:19093"
      - "127.0.0.1:19094:19094"
      - "127.0.0.1:19095:19095"
      - "127.0.0.1:19096:19096"
      - "127.0.0.1:19097:19097"
      - "127.0.0.1:18888:8888"
      - "127.0.0.1:18888:8888/udp"
    tmpfs:
      - /tmp/onetui-kafka-logs:mode=1777
      - /tmp/onetui-kafka-tls:mode=1777
    volumes:
      - ./fixtures/kafka-tls.sh:/onetui-kafka-tls.sh:ro
      - ./fixtures/kafka-kerberos.sh:/onetui-kafka-kerberos.sh:ro
      - ./fixtures/kafka-security.sh:/onetui-kafka-security.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 2s
      timeout: 10s
      retries: 30
  postgres:
    image: postgres:16.13
    environment:
      POSTGRES_USER: onetui_fixture_admin
      POSTGRES_PASSWORD: fixture-admin-only
      POSTGRES_DB: onetui_fixture
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./fixtures/postgres.sql:/docker-entrypoint-initdb.d/01-fixture.sql:ro
      - ./fixtures/postgres-tls.sh:/docker-entrypoint-initdb.d/02-tls.sh:ro
      - ./fixtures/server.ext:/onetui-server.ext:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onetui_fixture_admin -d onetui_fixture"]
      interval: 1s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.18.2
    environment:
      QDRANT__SERVICE__API_KEY: fixture-admin-only
      QDRANT__SERVICE__READ_ONLY_API_KEY: fixture-reader-only
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:16334:6334"
    tmpfs:
      - /qdrant/storage
  qdrant-tls:
    image: qdrant/qdrant:v1.18.2
    entrypoint: ["/bin/sh", "/onetui-qdrant-tls.sh"]
    environment:
      QDRANT__SERVICE__API_KEY: fixture-admin-only
      QDRANT__SERVICE__READ_ONLY_API_KEY: fixture-reader-only
      QDRANT__SERVICE__ENABLE_TLS: "true"
      QDRANT__TLS__CERT: /qdrant/tls/server.crt
      QDRANT__TLS__KEY: /qdrant/tls/server.key
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:16335:6334"
    tmpfs:
      - /qdrant/storage
      - /qdrant/tls
    volumes:
      - ./fixtures/qdrant-tls.sh:/onetui-qdrant-tls.sh:ro
      - ./fixtures/server.ext:/onetui-server.ext:ro
    healthcheck:
      test: ["CMD-SHELL", "openssl s_client -connect 127.0.0.1:6334 -servername localhost -alpn h2 -CAfile /qdrant/tls/ca.crt -verify_hostname localhost -verify_return_error < /dev/null > /dev/null 2>&1"]
      interval: 1s
      timeout: 3s
      retries: 30
