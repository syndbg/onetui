# Disposable credentials. The browser cannot publish data, create consumers or ACK.
port: 4222
http_port: 8222
jetstream { store_dir: "/data", max_memory_store: 256MB, max_file_store: 128MB }
authorization {
  users: [
    { user: "fixture-admin", password: "fixture-admin-only" }
    {
      user: "fixture-reader", password: "fixture-reader-only"
      permissions: {
        publish: ["$JS.API.INFO", "$JS.API.STREAM.LIST", "$JS.API.STREAM.INFO.*", "$JS.API.STREAM.MSG.GET.*"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: "fixture-denied", password: "fixture-denied-only"
      permissions: { publish: { deny: [">"] }, subscribe: ["_INBOX.>"] }
    }
  ]
}
