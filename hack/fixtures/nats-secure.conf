# Disposable NKEY from async-nats' Apache-2.0 test credentials; never use outside fixtures.
port: 4222
http_port: 8222
tls {
  cert_file: "/tls/server.crt"
  key_file: "/tls/server.key"
  ca_file: "/tls/ca.crt"
  verify: true
  handshake_first: auto
}
jetstream { domain: FIXTURE, store_dir: "/data", max_memory_store: 64MB, max_file_store: 64MB }
authorization {
  users: [
    { user: "fixture-admin", password: "fixture-admin-only" }
    {
      nkey: UAFHG6FUD2UU4SDFVAFUL5LDFO2XM4WYM76UNXTPJYJK7EEMYRBHT2VE
      permissions: {
        # Domain routing rewrites requests to the default API prefix before permission checks.
        publish: ["$JS.API.INFO", "$JS.API.STREAM.LIST", "$JS.API.STREAM.INFO.*", "$JS.API.STREAM.MSG.GET.*", "$JS.API.CONSUMER.LIST.*", "$JS.API.CONSUMER.INFO.*.*"]
        subscribe: ["_INBOX.>", "demo.*"]
      }
    }
  ]
}
