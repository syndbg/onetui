port: 4222
http_port: 8222
cluster { name: "onetui-system", listen: "0.0.0.0:6222" }
system_account: SYS
accounts {
  SYS {
    users: [
      { user: "fixture-admin", password: "fixture-admin-only" }
      {
        user: "fixture-reader", password: "fixture-reader-only"
        permissions: {
          publish: ["$SYS.REQ.SERVER.PING.STATSZ"]
          subscribe: ["_INBOX.>"]
        }
      }
      {
        user: "fixture-denied", password: "fixture-denied-only"
        permissions: { publish: { deny: [">"] }, subscribe: ["_INBOX.>"] }
      }
    ]
  }
}
