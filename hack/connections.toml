# Environment references are populated with fixture-only values by hack/dev.sh.
# Optional built-in palette; run `onetui schema` for accepted names.
theme = "monokai"

# Session overrides: v or :display. Run `onetui schema` for values and defaults.
[display]
format = "auto"
pretty_print = true
highlight = true
word_wrap = true
unicode = "literal"

[connections.local_pg]
kind = "postgres"
url_env = "ONETUI_POSTGRES_URL"

[connections.local_qdrant]
kind = "qdrant"
url = "http://127.0.0.1:16334"
api_key_env = "ONETUI_QDRANT_API_KEY"

# Fixed disposable Kafka fixture; no credentials or group offsets are used.
[connections.local_kafka]
kind = "kafka"
bootstrap_servers = ["127.0.0.1:19092"]
security_protocol = "PLAINTEXT"

# Kafka protocol on Redpanda, with its local Avro registry.
[connections.local_redpanda]
kind = "kafka"
bootstrap_servers = ["127.0.0.1:29092"]
security_protocol = "PLAINTEXT"
[[connections.local_redpanda.decoders]]
topic = "demo_avro"
field = "value"
format = "avro"
framing = "confluent"
[connections.local_redpanda.decoders.registry]
url = "http://127.0.0.1:18081"

[connections.local_nats]
kind = "nats"
servers = ["nats://127.0.0.1:14222"]
tls = false
username_env = "ONETUI_NATS_USERNAME"
password_env = "ONETUI_NATS_PASSWORD"
