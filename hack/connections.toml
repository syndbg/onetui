# Environment references are populated with fixture-only values by hack/dev.sh.
# Optional built-in palette; run `onetui schema` for accepted names.
theme = "monokai"

[connections.local_pg]
kind = "postgres"
url_env = "ONETUI_POSTGRES_URL"

[connections.local_qdrant]
kind = "qdrant"
url = "http://127.0.0.1:16334"
api_key_env = "ONETUI_QDRANT_API_KEY"
