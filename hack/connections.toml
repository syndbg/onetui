# Environment references are populated with fixture-only values by hack/dev.sh.
# Optional built-in palette; run `onetui schema` for accepted names.
theme = "monokai"

# Session overrides: v or :display. Run `onetui schema` for values and defaults.
[display]
format = "auto"
pretty_print = true
highlight = true
word_wrap = true
unicode = "literal"

[connections.local_pg]
kind = "postgres"
url_env = "ONETUI_POSTGRES_URL"

[connections.local_pg_replica]
kind = "postgres"
url_env = "ONETUI_POSTGRES_REPLICA_URL"

[connections.local_dynamodb]
kind = "dynamodb"
region = "us-east-1"
endpoint_url = "http://127.0.0.1:18000"
streams_endpoint_url = "http://127.0.0.1:18000"
access_key_id_env = "ONETUI_DYNAMODB_ACCESS_KEY"
secret_access_key_env = "ONETUI_DYNAMODB_SECRET_KEY"

[connections.local_qdrant]
kind = "qdrant"
rest_url = "http://127.0.0.1:16333"
url = "http://127.0.0.1:16334"
api_key_env = "ONETUI_QDRANT_API_KEY"

# Fixed disposable Kafka fixture; no credentials or group offsets are used.
[connections.local_kafka]
kind = "kafka"
bootstrap_servers = ["127.0.0.1:19092"]
security_protocol = "PLAINTEXT"

# make tasks render catalog paths into target/demo-onetui.toml.
[connections.local_redpanda]
kind = "kafka"
bootstrap_servers = ["127.0.0.1:29092"]
security_protocol = "PLAINTEXT"
[[connections.local_redpanda.decoders]]
topic = "demo_avro"
field = "value"
format = "avro"
framing = "confluent"
[connections.local_redpanda.decoders.registry]
url = "http://127.0.0.1:18081"

[[connections.local_redpanda.decoders]]
topic = "demo_protobuf"
field = "value"
format = "protobuf"
framing = "confluent"
registry = { url = "http://127.0.0.1:18081" }

[[connections.local_redpanda.decoders]]
topic = "demo_avro_catalog"
field = "value"
format = "avro"
framing = "raw"
catalog = { directory = "/generated/by/make", schema = "avro_event", references = ["avro_customer"] }

[[connections.local_redpanda.decoders]]
topic = "demo_protobuf_catalog"
field = "value"
format = "protobuf"
framing = "raw"
message_name = "demo.Event"
catalog = { directory = "/generated/by/make", schema = "protobuf_event" }

[connections.local_nats]
kind = "nats"
subjects = ["demo.live", "demo.*"]
servers = ["nats://127.0.0.1:14222"]
tls = false
username_env = "ONETUI_NATS_USERNAME"
password_env = "ONETUI_NATS_PASSWORD"

[connections.local_rabbitmq]
kind = "rabbitmq"
url = "http://127.0.0.1:15672"
username_env = "ONETUI_RABBITMQ_USERNAME"
password_env = "ONETUI_RABBITMQ_PASSWORD"

[connections.local_nats_system]
kind = "nats"
servers = ["nats://127.0.0.1:14226"]
tls = false
jetstream = false
system_discovery = true
username_env = "ONETUI_NATS_USERNAME"
password_env = "ONETUI_NATS_PASSWORD"

[[connections.local_nats.decoders]]
subject = "demo.avro"
format = "avro"
catalog = { directory = "/ONETUI_DEMO_TARGET_DIR/nats-schemas/avro", schema = "event" }

[[connections.local_nats.decoders]]
subject = "demo.protobuf"
format = "protobuf"
catalog = { directory = "/ONETUI_DEMO_TARGET_DIR/nats-schemas/protobuf", schema = "event" }
message_name = "demo.Event"

[[connections.local_nats.decoders]]
subject = "demo.avro.registry"
format = "avro"
framing = "confluent"
registry = { url = "http://127.0.0.1:18081" }

[[connections.local_nats.decoders]]
subject = "demo.protobuf.registry"
format = "protobuf"
framing = "confluent"
registry = { url = "http://127.0.0.1:18081" }
